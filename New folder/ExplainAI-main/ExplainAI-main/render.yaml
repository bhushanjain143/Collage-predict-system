# Example for deploying from the **Collage** monorepo on Render.
# Adjust `rootDir` if your repository layout differs, or deploy only this folder as its own repo.
services:
  - type: web
    name: explainai-mhtcet
    runtime: python
    rootDir: "New folder/ExplainAI-main/ExplainAI-main"
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && gunicorn -w 2 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.6"
